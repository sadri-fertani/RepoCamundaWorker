replicaCount: 1

namespace: svc-space

image:
  repository: sadrifertani/testwrkcmd
  tag: latest
  pullPolicy: Always

containerPort: 8000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  
env:
  - name: "ASPNETCORE_ENVIRONMENT"
    value: "Production"
  - name: "Apis__MonApiURL"
    value: "http://monapi-service.api-space.svc.cluster.local"
  - name: "Zeebe__GatewayAddress"
    value: "4.tcp.ngrok.io:11338"

resources: {}